# registry.yaml — findings 레코드
#
# 형식과 판정 유도 규칙은 findings/SCHEMA.md 를 보십시오.
#
#   python run.py claims    검증 → findings/PAPER_CODE_MAP.md 재생성
#
# verdict 를 손으로 적지 마십시오. render.py 가 슬롯에서 유도합니다.
# 위치 필드는 항상 따옴표로 감싸십시오 ("10:30" 이 시각으로 읽히는 함정).
#
# 슬롯 상태 5가지: 미조사 / 확인 / 부재확인 / 조사했으나불명 / 구조적불가
# 아래 레코드는 **씨앗이지 완성 목록이 아닙니다.** 특히 META- 계열은
# notebooks/01_pkl_structure.ipynb 의 재집계 결과를 보고 확정합니다.

